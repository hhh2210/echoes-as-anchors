name: CPU smoke

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v9.0.0
      - run: python -m unittest discover -s tests
      - run: make dist
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: python -c "import echoes_as_anchors; from echoes_as_anchors.evaluation.two_stage_common import DEFAULT_PROTOCOL_ID; print(DEFAULT_PROTOCOL_ID)"
        working-directory: /tmp

  registry-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ".[harness]"
      - run: python -c "from echoes_as_anchors.evaluation import register_models; from lm_eval.api.registry import model_registry; assert register_models() == ('echoes-hf', 'echoes-vllm'); assert 'echoes-hf' in model_registry and 'echoes-vllm' in model_registry"
